<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Casse-Briques 🎮</title>
    <style>
        /* Style pour centrer le jeu et donner un bel aspect visuel */
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* Conteneur principal du jeu */
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        /* Titre du jeu */
        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Zone de canvas pour dessiner le jeu */
        canvas {
            display: block;
            background: #2d3748;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            cursor: none;
        }

        /* Affichage du score et des vies */
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
        }

        /* Instructions pour le joueur */
        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            text-align: center;
            line-height: 1.8;
        }

        .instructions h3 {
            margin-top: 0;
        }

        /* Message de jeu terminé */
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            font-size: 3em;
            margin: 0 0 20px 0;
        }

        .game-over button {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Casse-Briques 🎮</h1>
        
        <!-- Canvas où le jeu sera dessiné -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Affichage des informations du jeu -->
        <div class="info">
            <div>🎯 Score: <span id="score">0</span></div>
            <div>❤️ Vies: <span id="lives">3</span></div>
        </div>

        <!-- Instructions pour jouer -->
        <div class="instructions">
            <h3>📖 Comment jouer :</h3>
            <p>
                🖱️ <strong>Déplacez la souris</strong> pour contrôler la raquette<br>
                ⌨️ Ou utilisez les <strong>touches ← →</strong> du clavier<br>
                🎯 Détruisez toutes les briques pour gagner !<br>
                ❤️ Vous avez 3 vies - ne laissez pas la balle tomber !
            </p>
        </div>
    </div>

    <!-- Message de fin de partie -->
    <div class="game-over" id="gameOver">
        <h2 id="gameOverText">Game Over!</h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">🔄 Rejouer</button>
    </div>

    <script>
        // ========================================
        // CONFIGURATION ET VARIABLES DU JEU
        // ========================================
        
        // Récupération du canvas (la zone de dessin)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Variables pour la balle
        let ballX = canvas.width / 2;  // Position X de la balle (centre au départ)
        let ballY = canvas.height - 100;  // Position Y de la balle
        let ballDX = 4;  // Vitesse horizontale de la balle
        let ballDY = -4;  // Vitesse verticale de la balle (négatif = vers le haut)
        const ballRadius = 10;  // Taille de la balle

        // Variables pour la raquette
        const paddleHeight = 15;  // Hauteur de la raquette
        const paddleWidth = 120;  // Largeur de la raquette
        let paddleX = (canvas.width - paddleWidth) / 2;  // Position X de la raquette (centrée)
        let paddleSpeed = 8;  // Vitesse de déplacement de la raquette

        // Variables pour les contrôles au clavier
        let rightPressed = false;  // Est-ce que la flèche droite est pressée ?
        let leftPressed = false;   // Est-ce que la flèche gauche est pressée ?

        // Variables pour le contrôle à la souris
        let mouseX = canvas.width / 2;  // Position de la souris

        // Variables pour les briques
        const brickRowCount = 6;  // Nombre de lignes de briques
        const brickColumnCount = 9;  // Nombre de colonnes de briques
        const brickWidth = 75;  // Largeur d'une brique
        const brickHeight = 25;  // Hauteur d'une brique
        const brickPadding = 10;  // Espace entre les briques
        const brickOffsetTop = 60;  // Décalage depuis le haut du canvas
        const brickOffsetLeft = 35;  // Décalage depuis la gauche du canvas

        // Tableau pour stocker toutes les briques
        const bricks = [];
        
        // Couleurs différentes pour chaque ligne de briques
        const brickColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];

        // Variables de jeu
        let score = 0;  // Score du joueur
        let lives = 3;  // Nombre de vies restantes
        let gameRunning = true;  // Est-ce que le jeu est en cours ?

        // ========================================
        // INITIALISATION DES BRIQUES
        // ========================================
        
        // Créer toutes les briques au début du jeu
        function initBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    // Chaque brique a une position X, Y, un statut (visible ou non), et une couleur
                    bricks[c][r] = {
                        x: 0,
                        y: 0,
                        status: 1,  // 1 = visible, 0 = détruite
                        color: brickColors[r]  // Couleur selon la ligne
                    };
                }
            }
        }

        // ========================================
        // GESTION DES ÉVÉNEMENTS (CLAVIER ET SOURIS)
        // ========================================
        
        // Quand une touche est pressée
        document.addEventListener('keydown', keyDownHandler);
        function keyDownHandler(e) {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = true;  // Flèche droite pressée
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = true;  // Flèche gauche pressée
            }
        }

        // Quand une touche est relâchée
        document.addEventListener('keyup', keyUpHandler);
        function keyUpHandler(e) {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = false;  // Flèche droite relâchée
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = false;  // Flèche gauche relâchée
            }
        }

        // Suivre la position de la souris
        canvas.addEventListener('mousemove', mouseMoveHandler);
        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.offsetLeft;
            // La souris contrôle directement la position de la raquette
            if (relativeX > 0 && relativeX < canvas.width) {
                mouseX = relativeX - paddleWidth / 2;
            }
        }

        // ========================================
        // FONCTIONS DE DÉTECTION DE COLLISION
        // ========================================
        
        // Vérifier si la balle touche une brique
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    // Si la brique est encore visible
                    if (b.status === 1) {
                        // Calculer si la balle touche cette brique
                        if (ballX > b.x && ballX < b.x + brickWidth &&
                            ballY > b.y && ballY < b.y + brickHeight) {
                            // Inverser la direction de la balle
                            ballDY = -ballDY;
                            // Marquer la brique comme détruite
                            b.status = 0;
                            // Augmenter le score
                            score += 10;
                            document.getElementById('score').textContent = score;
                            
                            // Vérifier si toutes les briques sont détruites (victoire !)
                            if (score === brickRowCount * brickColumnCount * 10) {
                                showGameOver(true);
                            }
                        }
                    }
                }
            }
        }

        // ========================================
        // FONCTIONS DE DESSIN
        // ========================================
        
        // Dessiner la balle
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';  // Couleur dorée
            ctx.fill();
            // Ajouter un contour blanc pour la rendre plus visible
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        }

        // Dessiner la raquette
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight, 7);
            ctx.fillStyle = '#4ECDC4';  // Couleur turquoise
            ctx.fill();
            // Ajouter un effet de brillance
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        }

        // Dessiner toutes les briques
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    // Si la brique est visible
                    if (bricks[c][r].status === 1) {
                        // Calculer la position de la brique
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        // Dessiner la brique avec sa couleur
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 5);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        // Ajouter un contour plus sombre
                        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
        }

        // ========================================
        // FONCTION PRINCIPALE DU JEU
        // ========================================
        
        // Cette fonction est appelée à chaque frame pour mettre à jour le jeu
        function draw() {
            if (!gameRunning) return;  // Si le jeu n'est pas en cours, ne rien faire

            // Effacer tout le canvas pour redessiner
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner tous les éléments
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // ========================================
            // GESTION DES REBONDS DE LA BALLE
            // ========================================
            
            // Rebond sur les murs gauche et droit
            if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) {
                ballDX = -ballDX;  // Inverser la direction horizontale
            }
            
            // Rebond sur le mur du haut
            if (ballY + ballDY < ballRadius) {
                ballDY = -ballDY;  // Inverser la direction verticale
            } 
            // Rebond sur la raquette ou perte d'une vie
            else if (ballY + ballDY > canvas.height - ballRadius - 10) {
                // Vérifier si la balle touche la raquette
                if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                    // Calculer l'angle de rebond selon où la balle touche la raquette
                    const hitPos = (ballX - paddleX) / paddleWidth;  // Position de 0 à 1
                    const angle = (hitPos - 0.5) * 2;  // Angle de -1 à 1
                    ballDX = angle * 6;  // Modifier la vitesse horizontale selon l'angle
                    ballDY = -ballDY;  // Inverser la direction verticale
                } else {
                    // La balle est tombée ! Perdre une vie
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    
                    if (lives === 0) {
                        // Plus de vies = Game Over
                        showGameOver(false);
                    } else {
                        // Réinitialiser la position de la balle
                        ballX = canvas.width / 2;
                        ballY = canvas.height - 100;
                        ballDX = 4;
                        ballDY = -4;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            // ========================================
            // DÉPLACEMENT DE LA BALLE ET DE LA RAQUETTE
            // ========================================
            
            // Déplacer la balle
            ballX += ballDX;
            ballY += ballDY;

            // Déplacer la raquette avec le clavier
            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += paddleSpeed;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= paddleSpeed;
            }

            // Déplacer la raquette avec la souris (plus fluide)
            if (mouseX !== paddleX) {
                paddleX += (mouseX - paddleX) * 0.3;  // Mouvement progressif vers la souris
                // Limiter la raquette aux bords du canvas
                if (paddleX < 0) paddleX = 0;
                if (paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
            }

            // Appeler draw() à nouveau pour créer une animation fluide
            requestAnimationFrame(draw);
        }

        // ========================================
        // GESTION DE LA FIN DE PARTIE
        // ========================================
        
        // Afficher le message de fin de partie
        function showGameOver(won) {
            gameRunning = false;
            const gameOverDiv = document.getElementById('gameOver');
            const gameOverText = document.getElementById('gameOverText');
            const finalScore = document.getElementById('finalScore');

            if (won) {
                gameOverText.textContent = '🎉 VICTOIRE ! 🎉';
                gameOverText.style.color = '#4ECDC4';
                finalScore.textContent = `Félicitations ! Vous avez détruit toutes les briques !`;
            } else {
                gameOverText.textContent = '💔 GAME OVER 💔';
                gameOverText.style.color = '#FF6B6B';
                finalScore.textContent = `Score final : ${score}`;
            }

            gameOverDiv.style.display = 'block';
        }

        // Redémarrer le jeu
        function restartGame() {
            // Réinitialiser toutes les variables
            ballX = canvas.width / 2;
            ballY = canvas.height - 100;
            ballDX = 4;
            ballDY = -4;
            paddleX = (canvas.width - paddleWidth) / 2;
            score = 0;
            lives = 3;
            gameRunning = true;

            // Mettre à jour l'affichage
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('gameOver').style.display = 'none';

            // Recréer les briques
            initBricks();

            // Relancer le jeu
            draw();
        }

        // ========================================
        // DÉMARRAGE DU JEU
        // ========================================
        
        // Initialiser les briques au chargement de la page
        initBricks();
        
        // Lancer la boucle de jeu
        draw();
    </script>
</body>
</html>
